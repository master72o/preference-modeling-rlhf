name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run Pytest Suite
        run: |
          pytest --cov=preference_reward tests/
      - name: Run Preference Reward Calibration CLI
        run: |
          python -m preference_reward.cli run --dataset data/preference_dataset.jsonl --output-dir results --report-path reports/preference_reward_report.md --figures-dir reports/figures
